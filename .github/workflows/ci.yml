name: CI Quality Checks & Build
on:
  push:
    branches: [main, master, dev, prod]
  pull_request:
    branches: [main, master, dev, prod]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type Check (tsc)
        run: npm run typecheck

      - name: Lint Check (eslint)
        run: npm run lint

      - name: Code Formatting Check (prettier)
        run: npm run format

      - name: Run Tests (vitest)
        run: npm run test

      - name: Build Library (tsup)
        run: npm run build