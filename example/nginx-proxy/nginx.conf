events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # Custom log format showing the generated $request_id
  log_format custom '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time req_id=$request_id';

  access_log /var/log/nginx/access.log custom;

  upstream backend_app {
    server app:3000;
  }

  server {
    listen 80;
    server_name localhost;

    location / {
      # ── Trace ID Propagation ───────────────────────────────────────────
      # Nginx generates a unique $request_id (UUID-like 128-bit hex string)
      # and injects it as X-Request-ID and X-Trace-ID downstream to the app.
      proxy_set_header X-Request-ID $request_id;
      proxy_set_header X-Trace-ID   $request_id;

      # Forward client headers
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # Forward browser interaction header if sent by @vprl/client
      proxy_set_header X-VPRL-Interaction-ID $http_x_vprl_interaction_id;

      # Proxy pass to the Vite / Node application
      proxy_pass http://backend_app;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }
  }
}
